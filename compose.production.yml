services:
  scm-api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_packages_token
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      ARGON2_HASH_LENGTH: ${ARGON2_HASH_LENGTH:-32}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-dirego-scm}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-600}
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:?JWT_SIGNING_KEY_ID is required}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?JWT_PRIVATE_KEY_B64 is required}
      JWT_PUBLIC_KEYS_JSON: ${JWT_PUBLIC_KEYS_JSON:?JWT_PUBLIC_KEYS_JSON is required}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-28800}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-2592000}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-__Host-dirego_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
    expose:
      - "3000"
    networks:
      - scm_internal_net
    security_opt:
      - no-new-privileges:true

networks:
  scm_internal_net:
    external: true
    name: scm_internal_net

secrets:
  github_packages_token:
    environment: GITHUB_PACKAGES_TOKEN
