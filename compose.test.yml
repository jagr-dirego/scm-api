services:
  postgres-test:
    image: postgres:16.4
    container_name: scm-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: scm_test
      POSTGRES_USER: scm_test
      POSTGRES_PASSWORD: scm_test_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - scm_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm_test -d scm_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-test:
    image: redis:8.2.1-alpine
    container_name: scm-redis-test
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - scm_test_redis_password
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - scm_redis_test_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a scm_test_redis_password --no-auth-warning ping | grep PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  object-storage-test:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: scm-object-storage-test
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scm_test_access_key
      MINIO_ROOT_PASSWORD: scm_test_secret_key_change_only_for_local_tests
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - scm_object_storage_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: scm-object-storage-init
    restart: "no"
    profiles: ["init"]
    depends_on:
      object-storage-test:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: scm_test_access_key
      MINIO_ROOT_PASSWORD: scm_test_secret_key_change_only_for_local_tests
      MINIO_BUCKET: dirego-scm-test
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://object-storage-test:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

volumes:
  scm_postgres_test_data:
    name: scm_postgres_test_data
  scm_redis_test_data:
    name: scm_redis_test_data
  scm_object_storage_test_data:
    name: scm_object_storage_test_data
