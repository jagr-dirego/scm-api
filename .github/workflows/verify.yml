name: Verificar API

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: scm_test
          POSTGRES_PASSWORD: scm_test_password
          POSTGRES_DB: scm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scm_test -d scm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://scm_test:scm_test_password@127.0.0.1:5432/scm_test
      TEST_DATABASE_URL: postgresql://scm_test:scm_test_password@127.0.0.1:5432/scm_test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Configurar Node.js y GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@jagr-dirego"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar tipos
        run: pnpm exec tsc --noEmit

      - name: Ejecutar lint
        run: pnpm lint

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Ejecutar pruebas de integracion PostgreSQL
        run: pnpm test:integration

      - name: Compilar API
        run: pnpm build
